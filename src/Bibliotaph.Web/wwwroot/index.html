<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bibliotaph</title>
  <base href="/" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <!-- So the site installs as an app of its own, for a tablet at the table or a window on a PC. -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#f9f8f5" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1d211f" media="(prefers-color-scheme: dark)" />
  <link rel="stylesheet" href="css/bibliotaph.css" />
  <!-- Before anything draws, so a dark theme never flashes light. -->
  <script src="js/theme.js"></script>
  <script src="js/library.js"></script>
</head>
<body>
  <div id="app"><div class="bt-loading">Opening Bibliotaph…</div></div>
  <div id="blazor-error-ui" role="alert">Something went wrong. <a href="" class="reload">Reload</a></div>
  <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
