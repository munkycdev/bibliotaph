    .tile { fill: #232b26 }
    .glyph { fill: #f9f8f5; stroke: #f9f8f5 }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #e8ece6 }
      .glyph { fill: #1d211f; stroke: #1d211f }
    }
  </style>
