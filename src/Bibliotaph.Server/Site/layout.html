<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{title}}</title>
  <meta name="description" content="{{description}}" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="/css/bibliotaph.css" />
  <script src="/js/theme.js"></script>
</head>
<body class="bt-site">
  <a class="bt-skip" href="#content">Skip to content</a>
  <header class="bt-sitehead">
    <a class="bt-brand" href="/" aria-label="Bibliotaph home"><span class="bt-monogram">b.</span><span>Bibliotaph</span></a>
    <nav class="bt-sitenav" aria-label="Site">
      <a href="/features">Features</a>
      <a href="/about">About</a>
      <a href="/changelog">Change log</a>
      {{account}}
    </nav>
  </header>
  <main id="content" class="bt-sitemain">
{{content}}
  </main>
  <footer class="bt-sitefoot">
    <p class="bt-tagline">{{tagline}}</p>
    <nav aria-label="More about Bibliotaph">
{{links}}
    </nav>
    <p>Version {{version}} · Copyright © 2026 munkycdev. Bibliotaph is free software under the GNU General Public License, version 3 or later.</p>
  </footer>
</body>
</html>
