name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model-pins:
    name: Model pins (temporary)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - shell: bash
        run: |
          for repo in Qwen/Qwen3-14B-GGUF Qwen/Qwen3-30B-A3B-GGUF unsloth/Qwen3-30B-A3B-Instruct-2507-GGUF \
              bartowski/Meta-Llama-3.1-8B-Instruct-GGUF ibm-granite/granite-3.3-8b-instruct-GGUF bartowski/ibm-granite_granite-3.3-8b-instruct-GGUF \
              bartowski/microsoft_Phi-4-mini-instruct-GGUF unsloth/Phi-4-mini-instruct-GGUF \
              bartowski/mistralai_Mistral-Small-3.2-24B-Instruct-2506-GGUF unsloth/Mistral-Small-3.2-24B-Instruct-2506-GGUF; do
            json=$(curl -fsSL "https://huggingface.co/api/models/$repo/revision/main?blobs=true") || { echo "::warning title=$repo::not found"; continue; }
            echo "$json" | jq -r --arg repo "$repo" '. as $m | ($m.cardData.license // "?") as $lic | $m.siblings[]
              | select(.rfilename | test("Q4_K_M\\.gguf$")) | "::notice title=\($repo)::\($m.sha) \(.rfilename) \(.lfs.size // .size) \(.lfs.sha256 // "?") \($lic)"'
          done

  build-and-test:
    name: Build and test (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages

    steps:
      # Real-time scanning inspects every file restore, build and the tests write, which costs minutes on a hosted
      # runner. The runner is thrown away after the job.
      - name: Turn off Defender real-time scanning
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - uses: actions/checkout@v4

      # .NET 11 is in release candidate until November 2026, pinned to the exact RC SDK; use '11.0.x' with
      # dotnet-quality ga then.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.100-rc.2.26504.105'

      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Show SDK
        run: dotnet --info

      # Each step runs build/verify.ps1, the same script developers run before pushing, so the two can't drift apart.
      - name: Restore
        shell: pwsh
        run: ./build/verify.ps1 -Step Restore

      # llama.cpp's server for the built-in AI, and the tiny model its test runs; both pinned in build/engine.json.
      - uses: actions/cache@v4
        with:
          path: artifacts/cache
          key: engine-${{ hashFiles('build/engine.json') }}

      - name: Built-in AI engine
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./build/verify.ps1 -Step Engine

      - name: Build (Debug, warnings as errors)
        shell: pwsh
        run: ./build/verify.ps1 -Step Build

      # Writes the licence of every package that ships beside the build, and fails on one that isn't GPL-3.0-compatible.
      - name: Licences
        shell: pwsh
        run: ./build/verify.ps1 -Step Licenses

      - name: Test
        shell: pwsh
        run: ./build/verify.ps1 -Step Test

      # Opens the real window, visits every screen in light and dark, reads a synthetic PDF and image, and fails on any
      # exception or binding error.
      - name: App smoke test
        shell: pwsh
        run: ./build/verify.ps1 -Step Smoke

      # Source files are read-only by construction: a write API in Core must fail the build.
      - name: Banned file APIs fail the build
        shell: pwsh
        run: ./build/verify.ps1 -Step BannedApi

      - name: Build (Release)
        shell: pwsh
        run: ./build/verify.ps1 -Step Release

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
