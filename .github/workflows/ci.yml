name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request makes its earlier run moot, but every push to main keeps its run: each checks only what
# its own push changed, so a run cut short would leave those changes unchecked.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which checks the change needs: the Windows app's (the two Windows jobs), the web app's (the two Linux jobs), both or
  # neither. build/changes.ps1 decides from the projects that build each changed file, so a change to a shared project
  # such as Core or Processing runs both. The jobs it leaves out show as skipped, under the same names. Run workflow
  # runs everything, as does a push with no earlier commit to compare with.
  changes:
    name: Changed parts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      windows: ${{ steps.changes.outputs.windows }}
      web: ${{ steps.changes.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request is checked out as its merge commit, whose first parent is the base branch. A push to main
          # compares with the commit before it, which can be any distance back.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}

      - id: changes
        shell: pwsh
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          $before = $false
          if ($env:EVENT -eq 'push' -and $env:BEFORE -notmatch '^0*$') {
            git cat-file -e "$env:BEFORE^{commit}" 2>$null
            $before = $LASTEXITCODE -eq 0
          }
          if ($env:EVENT -eq 'pull_request') { ./build/changes.ps1 -Base HEAD^1 }
          elseif ($before) { ./build/changes.ps1 -Base $env:BEFORE }
          else { ./build/changes.ps1 -All }
          # The runner fails a pwsh step on the last native exit code, even the one handled above.
          exit 0

  # Two jobs side by side: the smoke test takes about as long as the tests, so running it beside them, rather than
  # after, puts it on every change to the Windows app for no more wall time than the slower of the two.
  build-and-test:
    name: Build and test (Windows)
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages
      # .NET 11 is in release candidate until November 2026, pinned to the exact RC SDK; use '11.0.x' with
      # dotnet-quality ga then.
      DOTNET_SDK: '11.0.100-rc.2.26504.105'
      DOTNET_INSTALL_DIR: D:\dotnet

    steps:
      - uses: actions/checkout@v4

      # Each step runs build/verify.ps1, the same script developers run before pushing, so the two can't drift apart.
      - uses: ./.github/actions/setup
        with:
          github-token: ${{ github.token }}

      - name: Build (Debug, warnings as errors)
        shell: pwsh
        run: ./build/verify.ps1 -Step Build

      # Writes the licence of every package that ships beside the build, and fails on one that isn't GPL-3.0-compatible.
      - name: Licences
        shell: pwsh
        run: ./build/verify.ps1 -Step Licenses

      # The web server's tests have their own job on Linux, where the server runs.
      - name: Test
        shell: pwsh
        run: ./build/verify.ps1 -Step Test -SkipTests Server

      # Source files are read-only by construction: a write API in Core must fail the build.
      - name: Banned file APIs fail the build
        shell: pwsh
        run: ./build/verify.ps1 -Step BannedApi

      # The release workflow builds Release itself, so pull requests leave this to main.
      - name: Build (Release)
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: ./build/verify.ps1 -Step Release

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

  # The web server's tests, on Linux like the container it runs in. Only their project and what it references are
  # built; the Windows job builds the rest of the solution.
  web-tests:
    name: Web tests (Linux)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      # .NET 11 is in release candidate until November 2026, pinned to the exact RC SDK; use '11.0.x' with
      # dotnet-quality ga then.
      DOTNET_SDK: '11.0.100-rc.2.26504.105'
      DOTNET_INSTALL_DIR: /home/runner/dotnet

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ${{ env.DOTNET_INSTALL_DIR }}
          key: dotnet-${{ runner.os }}-${{ env.DOTNET_SDK }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_SDK }}

      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        shell: pwsh
        run: ./build/verify.ps1 -Step Restore

      - name: Build (Debug, warnings as errors)
        shell: pwsh
        run: ./build/verify.ps1 -Step Build -OnlyTests Server

      - name: Test
        shell: pwsh
        run: ./build/verify.ps1 -Step Test -OnlyTests Server

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-results
          path: TestResults
          if-no-files-found: ignore

  # The web server's image, built on Linux like the container it runs in. Pull requests only build it; main pushes it
  # to GitHub's container registry, tagged with its commit and as main, for the deploy job and infra/setup.ps1.
  server-image:
    name: Server image (Linux)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/bibliotaph-server
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so the build can number itself as a release would.
          fetch-depth: 0

      # The image names its build as the Windows app does, MAJOR.MINOR from Directory.Build.props and the commit count
      # behind it, with the commit, so the site's footer and About say exactly what is deployed.
      - name: Build
        # The source label links the package to this repository, so this workflow's token can push to it.
        run: |
          minor=$(sed -n 's:.*<Version>\([0-9]*\.[0-9]*\)\.[0-9]*</Version>.*:\1:p' Directory.Build.props | head -1)
          version="$minor.$(git rev-list --count HEAD)"
          echo "Building $version ($GITHUB_SHA)"
          docker build -f src/Bibliotaph.Server/Container/Dockerfile -t bibliotaph-server \
            --build-arg VERSION="$version" --build-arg COMMIT="$GITHUB_SHA" \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.version="$version" --label org.opencontainers.image.revision="$GITHUB_SHA" .

      - name: Starts and answers
        run: |
          docker run -d --name server -p 8080:8080 bibliotaph-server
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz; then exit 0; fi
            sleep 1
          done
          docker logs server
          exit 1

      # The image's own PDF worker, shut in with Landlock: reads a made-up book's text and OCR, and can't open a file in
      # the users folder.
      - name: PDF worker is confined
        run: docker run --rm bibliotaph-server worker-check

      - name: Push
        if: env.PUSH == 'true'
        env:
          TOKEN: ${{ github.token }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in "${{ github.sha }}" main; do
            docker tag bibliotaph-server "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done

  # Every push to main that changes the web app and passes its tests and image goes live, without waiting for the
  # Windows jobs. infra/setup.ps1 makes the app and prints the repository variables this needs; until they're set,
  # nothing deploys.
  deploy-server:
    name: Deploy bibliotaph.online
    needs: [changes, web-tests, server-image]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AZURE_CLIENT_ID != '' &&
      needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    # Deploys go out in order and none is cut short; a later one simply follows.
    concurrency:
      group: deploy-server
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so the roll-out can tell whether what's live already includes this commit.
          fetch-depth: 0

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Deploys queue in the order their builds finish, not the order of the commits, so a later commit's faster run
      # can go live first and the older one would then replace it. A commit that is already in what's live stays put.
      - name: Roll out
        run: |
          live=$(az containerapp show -n ${{ vars.AZURE_CONTAINER_APP }} -g ${{ vars.AZURE_RESOURCE_GROUP }} \
            --query 'properties.template.containers[0].image' -o tsv)
          live=${live##*:}
          if [[ "$live" =~ ^[0-9a-f]{40}$ ]] && git merge-base --is-ancestor "$GITHUB_SHA" "$live" 2>/dev/null; then
            echo "The live image is $live, which already includes $GITHUB_SHA: nothing to roll out."
            exit 0
          fi
          az containerapp update -n ${{ vars.AZURE_CONTAINER_APP }} -g ${{ vars.AZURE_RESOURCE_GROUP }} \
            --image ghcr.io/${{ github.repository_owner }}/bibliotaph-server:${{ github.sha }} -o none

  # Opens the real window, visits every screen in light and dark, reads a synthetic PDF and image, and fails on any
  # exception or binding error.
  smoke:
    name: App smoke test (Windows)
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages
      # .NET 11 is in release candidate until November 2026, pinned to the exact RC SDK; use '11.0.x' with
      # dotnet-quality ga then.
      DOTNET_SDK: '11.0.100-rc.2.26504.105'
      DOTNET_INSTALL_DIR: D:\dotnet

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          github-token: ${{ github.token }}

      # Only the app and the licence tool: the tests and the other tools would only slow this job down.
      - name: Build the app (Debug, warnings as errors)
        shell: pwsh
        run: ./build/verify.ps1 -Step AppBuild

      # The smoke test checks the About popup lists the packages' licences.
      - name: Licences
        shell: pwsh
        run: ./build/verify.ps1 -Step Licenses

      - name: App smoke test
        shell: pwsh
        run: ./build/verify.ps1 -Step Smoke
