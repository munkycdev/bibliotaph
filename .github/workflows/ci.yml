name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request makes its earlier run moot, but every commit on main keeps its run: a release waits
# for CI on the commit it tags, so a merge landing just after the release commit mustn't cancel that commit's run.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build and test (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages
      # .NET 11 is in release candidate until November 2026, pinned to the exact RC SDK; use '11.0.x' with
      # dotnet-quality ga then.
      DOTNET_SDK: '11.0.100-rc.2.26504.105'
      DOTNET_INSTALL_DIR: D:\dotnet

    steps:
      # Real-time scanning inspects every file restore, build and the tests write, which costs minutes on a hosted
      # runner. The runner is thrown away after the job.
      - name: Turn off Defender real-time scanning
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      # The tests and the smoke test make their folders and SQLite files under %TEMP%, which is on C:, the runner's
      # slower disk. RUNNER_TEMP is on D:.
      - name: Keep temporary files on drive D
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - uses: actions/checkout@v4

      # The runner image has no .NET 11, and downloading it took about 40 seconds a run. The SDK lives in its own folder
      # so it can be cached; setup-dotnet finds it there and only puts it on the path.
      - uses: actions/cache@v4
        with:
          path: ${{ env.DOTNET_INSTALL_DIR }}
          key: dotnet-${{ runner.os }}-${{ env.DOTNET_SDK }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_SDK }}

      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Show SDK
        run: dotnet --info

      # Each step runs build/verify.ps1, the same script developers run before pushing, so the two can't drift apart.
      - name: Restore
        shell: pwsh
        run: ./build/verify.ps1 -Step Restore

      # llama.cpp's server for the built-in AI, and the tiny model its test runs; both pinned in build/engine.json.
      - uses: actions/cache@v4
        with:
          path: artifacts/cache
          key: engine-${{ hashFiles('build/engine.json') }}

      - name: Built-in AI engine
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./build/verify.ps1 -Step Engine

      - name: Build (Debug, warnings as errors)
        shell: pwsh
        run: ./build/verify.ps1 -Step Build

      # Writes the licence of every package that ships beside the build, and fails on one that isn't GPL-3.0-compatible.
      - name: Licences
        shell: pwsh
        run: ./build/verify.ps1 -Step Licenses

      - name: Test
        shell: pwsh
        run: ./build/verify.ps1 -Step Test

      # Opens the real window, visits every screen in light and dark, reads a synthetic PDF and image, and fails on any
      # exception or binding error. It is the slowest step, so pull requests skip it and main runs it; a release waits
      # for CI on its tagged commit, so no release ships without it.
      - name: App smoke test
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: ./build/verify.ps1 -Step Smoke

      # Source files are read-only by construction: a write API in Core must fail the build.
      - name: Banned file APIs fail the build
        shell: pwsh
        run: ./build/verify.ps1 -Step BannedApi

      # The release workflow builds Release itself, so pull requests leave this to main.
      - name: Build (Release)
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: ./build/verify.ps1 -Step Release

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

  # The web server's image, built on Linux like the container it runs in. Pull requests only build it; main pushes it
  # to the registry for the deploy job.
  server-image:
    name: Server image (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      PUSH: ${{ github.event_name == 'push' && vars.AZURE_CLIENT_ID != '' }}
      IMAGE: ${{ vars.AZURE_REGISTRY }}.azurecr.io/bibliotaph-server:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -f src/Bibliotaph.Server/Container/Dockerfile -t bibliotaph-server .

      - name: Starts and answers
        run: |
          docker run -d --name server -p 8080:8080 bibliotaph-server
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz; then exit 0; fi
            sleep 1
          done
          docker logs server
          exit 1

      - uses: azure/login@v2
        if: env.PUSH == 'true'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Push
        if: env.PUSH == 'true'
        run: |
          az acr login -n ${{ vars.AZURE_REGISTRY }}
          docker tag bibliotaph-server "$IMAGE"
          docker push "$IMAGE"

  # Every push to main that passes the Windows build and tests goes live. infra/setup.ps1 makes the app and prints
  # the repository variables this needs; until they're set, nothing deploys.
  deploy-server:
    name: Deploy bibliotaph.online
    needs: [build-and-test, server-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    # Deploys go out in order and none is cut short; a later one simply follows.
    concurrency:
      group: deploy-server
      cancel-in-progress: false
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Roll out
        run: |
          az containerapp update -n ${{ vars.AZURE_CONTAINER_APP }} -g ${{ vars.AZURE_RESOURCE_GROUP }} \
            --image ${{ vars.AZURE_REGISTRY }}.azurecr.io/bibliotaph-server:${{ github.sha }} -o none
